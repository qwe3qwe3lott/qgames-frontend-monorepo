# Локальный запуск фронта в прод-сборке: docker compose up --build -d --wait
# Один сервис web (nginx): статика обоих приложений и reverse proxy API на бэкенд — same-origin, как в проде.
# portal — https://<LOCAL_DOMAIN> (/api/** → бэкенд), admin — https://admin.<LOCAL_DOMAIN> (/api/admin/** → бэкенд);
# http:// — редирект на https://. LOCAL_DOMAIN — из .env в корне (шаблон — .env.example), сертификаты mkcert —
# docker/certs/, имена — в hosts (README.md, «Подготовка»).
# storybook — http://localhost:6006: витрина UI-компонентов (apps/storybook), только локально, в прод не входит.
# Без hot reload; для разработки — pnpm dev.
# Переменные окружения приложений вшиваются при сборке из apps/<app>/.env (шаблон — .env.example): после правки — --build.
# Бэкенд поднимается отдельно в своём репозитории (qgames-backend-monorepo): docker compose up --build -d --wait.

services:
  web:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    ports:
      - '443:8443'
      - '80:8080'
    environment:
      # Имена хостов сайтов (шаблон docker/nginx/web.conf.template): оба на одном порту, различаются по имени.
      PORTAL_SERVER_NAME: ${LOCAL_DOMAIN:?скопируйте .env.example в .env в корне репозитория}
      ADMIN_SERVER_NAME: admin.${LOCAL_DOMAIN:?скопируйте .env.example в .env в корне репозитория}
      # Бэкенд из своего compose, опубликованный на хосте.
      API_UPSTREAM: 'host.docker.internal:8080'
    # Сертификат mkcert на оба имени (cert.pem, key.pem); в образ не входит.
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    # host.docker.internal на Linux (в Docker Desktop есть и так). Резолвится и в IPv6 — в upstream nginx
    # берётся только IPv4 (docker/nginx/18-api-upstream.envsh).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Без свопа: memswap_limit = mem_limit. Замер без TLS: простой ~14 MiB, 360 SSE 5 мин — пик ~29 MiB.
    # С TLS и HTTP/2: простой ~13 MiB; пик под нагрузкой считаем прежним (adr/system/reverse-proxy.md).
    mem_limit: 48m
    memswap_limit: 48m
    # nginx жив и конфиг с сертификатами загружен (иначе nginx не стартует). 127.0.0.1, а не localhost:
    # localhost в alpine может разрешиться в ::1.
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  storybook:
    build:
      context: .
      dockerfile: docker/storybook.Dockerfile
    # Только статика без бэкенда и кук: HTTPS и имя в hosts не нужны.
    ports:
      - '6006:8080'
    mem_limit: 32m
    memswap_limit: 32m
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
