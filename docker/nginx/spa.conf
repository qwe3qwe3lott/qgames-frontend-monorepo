# SPA: TanStack Router рисует маршрут на клиенте, поэтому любой путь без файла отдаёт index.html.
# Подключается в server после location /api/....

# Сжатие только у статики: ответы API (в том числе SSE) не сжимаются.
# Хешированные ассеты Rsbuild: имя меняется при каждом изменении содержимого — кешируются навсегда.
# Несуществующий ассет — 404, а не index.html; add_header без always — только на успешном ответе.
location /static/ {
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    gzip on;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
