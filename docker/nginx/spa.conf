# SPA (portal, admin): TanStack Router рисует маршрут на клиенте, поэтому любой путь без файла отдаёт index.html.
server {
    # nginx-unprivileged работает не от root и не может слушать порты ниже 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Относительный Location в редиректах: снаружи контейнер опубликован на другом порту.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Заголовки безопасности на всех ответах (always — в том числе на 4xx/5xx).
    # merge: add_header в location дополняет эти заголовки, а не отменяет их (nginx >= 1.29.3).
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Хешированные ассеты Rsbuild: имя меняется при каждом изменении содержимого.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
