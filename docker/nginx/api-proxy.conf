# Прокси на бэкенд (upstream qgames_api из web.conf.template), подключается в location /api/....
proxy_pass http://qgames_api;
# HTTP/1.1 и пустой Connection: keep-alive до бэкенда и долгие SSE-потоки.
proxy_http_version 1.1;
proxy_set_header Connection "";
# Исходный Host (с портом) и X-Forwarded-*: бэкенд видит адрес сайта, а не upstream.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
# SSE (потоки комнаты и партии): кадры уходят клиенту сразу, без буферизации.
proxy_buffering off;
# Между кадрами потока не дольше ping бэкенда (5 с); 60 с — запас на паузы бэкенда.
proxy_read_timeout 60s;
# Те же заголовки ставит Spring Security, а nginx — на уровне server; без скрытия ответ получил бы их дважды.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Strict-Transport-Security;
