# Landing: статический экспорт Next (trailingSlash: true — страница лежит в <путь>/index.html).
server {
    # nginx-unprivileged работает не от root и не может слушать порты ниже 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Относительный Location в редиректе /path → /path/: снаружи контейнер опубликован на другом порту.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Заголовки безопасности на всех ответах (always — в том числе на 4xx/5xx).
    # merge: add_header в location дополняет эти заголовки, а не отменяет их (nginx >= 1.29.3).
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    error_page 404 /404.html;

    # Хешированные ассеты Next.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
