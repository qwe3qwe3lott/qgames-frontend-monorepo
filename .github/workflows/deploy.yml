# Прод-деплой фронтенда: push в ветку deploy (или ручной запуск) → typecheck, lint, unit-тесты → образ web в GHCR →
# /opt/qgames/bin/deploy.sh на VPS (adr/system/hosting.md). При изменении контракта бэкенд выкатывается первым.
name: deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:

# Деплои не идут параллельно и не прерываются на середине.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/qwe3qwe3lott/qgames-web
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # pnpm нужной версии (packageManager в package.json) ставит corepack.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # PUBLIC_* вшиваются в бандл при сборке образа из apps/<app>/.env (GitHub Variables окружения production).
      - name: Write app env
        env:
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          printf 'PUBLIC_GOOGLE_CLIENT_ID=%s\n' "$PUBLIC_GOOGLE_CLIENT_ID" > apps/portal/.env
          cp apps/admin/.env.example apps/admin/.env

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Тег — sha коммита: deploy.sh разворачивает именно его.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:deploy
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ключ пользователя deploy ограничен forced command: на сервере выполняется только deploy.sh с этими аргументами.
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "deploy@$HOST" frontend "$GITHUB_SHA"
