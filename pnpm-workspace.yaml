packages:
  - apps/*
  - packages/*
  - packages/games/*

# Все зависимости — в корневом node_modules (CLAUDE.md §2).
nodeLinker: hoisted

# Версии задаются только здесь; в package.json пакетов — `catalog:`.
catalogMode: strict

catalog:
  # Инструменты репозитория
  turbo: 2.11.9
  typescript: 6.0.3
  '@types/node': 24.19.2
  '@types/google.accounts': 0.0.18

  # Линтинг и форматирование
  eslint: 9.39.5
  gts: 7.0.0
  prettier: 3.9.10
  typescript-eslint: 8.71.2
  eslint-plugin-react-hooks: 7.1.1
  '@tanstack/eslint-plugin-query': 5.104.3
  eslint-plugin-boundaries: 7.2.0
  eslint-import-resolver-typescript: 4.4.5
  globals: 14.0.0
  stylelint: 17.16.0
  stylelint-config-standard: 40.0.0

  # React
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Сборка
  '@rsbuild/core': 2.2.13
  '@rsbuild/plugin-react': 2.1.1

  # Данные, роутинг, состояние, формы
  '@tanstack/react-query': 5.104.3
  '@tanstack/react-router': 1.170.45
  '@tanstack/router-plugin': 1.168.47
  zustand: 5.0.15
  react-hook-form: 7.90.0
  '@hookform/resolvers': 5.9.2
  zod: 4.6.7
  orval: 8.43.0

  # Стили и UI
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  tw-animate-css: 1.4.0
  shadcn: 4.22.0
  radix-ui: 1.8.1
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  lucide-react: 1.59.0
  sonner: 2.0.8
  next-themes: 0.4.6

# Install-скрипты зависимостей запрещены; бинарники приходят через optionalDependencies.
allowBuilds:
  esbuild: false
  unrs-resolver: false
